services:
   app:
       build:
           context: .
       ports:
           - "8001:8000"
       volumes:
           - ./:/app
           - static:/app/static

       command: >
           sh -c "python manage.py migrate &&
                  python manage.py runserver 0.0.0.0:8000"
       env_file:
           - .env
       depends_on:
           - db

   db:
       image: postgres:15-alpine
       restart: always
       ports:
           - "5434:5432"
       env_file:
           - .env
       volumes:
           - my_db:/var/lib/postgresql/data

volumes:
    my_db:
    static: